<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <h1>Calculadora de IMC</h1>
        <p>Introduce tu peso y estatura.</p>

        <form id="formulario">
            <label for="peso">Peso en kilogramos</label>
            <input id="peso" type="number" min="0.1" step="any"
                placeholder="Ej. 70" required>

            <label for="estatura">Estatura en metros</label>
            <input id="estatura" type="number" min="0.1" max="3"
                step="any" placeholder="Ej. 1.75" required>

            <button type="submit">Calcular IMC</button>
        </form>

        <!-- JavaScript mostrará aquí el resultado -->
        <p id="resultado" aria-live="polite"></p>
    </main>
</body>
</html>
